[workspace]
members = [
    "crates/ast_input",
    "crates/input_validation",
    "crates/semantic",
    "crates/ir",
    "crates/codegen",
    "crates/repair",
    "crates/compiler_loop",
    "crates/reporting",
    "crates/cli",
    "crates/ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Muhammed Shiyas N"]
description = "DIAGRUST: Compiler-in-the-Loop Diagnostic-Driven Rust Transpilation"


[workspace.dependencies]
anyhow       = "1.0"
thiserror    = "1.0"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
regex        = "1.10"
clap         = { version = "4.0", features = ["derive"] }
log          = "0.4"
env_logger   = "0.11"
glob         = "0.3"
walkdir      = "2.5"
eframe       = { version = "0.27", features = ["default"] }
egui         = "0.27"
